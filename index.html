<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IoT - Monitoramento Ambiental</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🌐 MONITORAMENTO IoT</h1>
            <p>Sala Técnica - Controle Ambiental</p>
        </header>

        <!-- Cards de Leitura Atual -->
        <section class="cards-grid">
            <div class="card">
                <span class="icon">🌡️</span>
                <h3>Temperatura</h3>
                <p id="temp-atual" class="value">-- °C</p>
            </div>

            <div class="card">
                <span class="icon">💧</span>
                <h3>Umidade</h3>
                <p id="umid-atual" class="value">-- %</p>
            </div>
        </section>

        <!-- Informações de Status -->
        <div class="info-status">
            <p><strong>Dispositivo:</strong> <span id="disp-atual">--</span></p>
            <p><strong>Última atualização:</strong> <span id="hora-atual">--:--:--</span></p>
        </div>

        <!-- Tabela de Histórico -->
        <section class="history-section">
            <h2>📊 Histórico de Medições</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Dispositivo</th>
                            <th>Temperatura</th>
                            <th>Umidade</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-historico">
                        <!-- Os dados serão injetados aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
